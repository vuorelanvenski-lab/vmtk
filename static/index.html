<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoikanhovi Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-green: #16a34a;
            --military-green: #0f2b16;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar - Large Logo */
        .sidebar {
            width: 30%;
            background-color: var(--military-green);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6vh 4vh;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .sidebar img {
            width: 90%;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.4));
        }

        /* Weather Widget */
        .weather-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            padding: 3vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
            border: 1px solid rgba(22, 163, 74, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .weather-title {
            font-size: 1.8vh;
            color: var(--accent-green);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 3vh;
        }

        .weather-icon {
            font-size: 6vh;
            color: #fff;
            filter: drop-shadow(0 0 10px var(--accent-green));
        }

        .weather-temp {
            font-size: 7vh;
            font-weight: 700;
            line-height: 1;
        }

        .weather-details {
            display: flex;
            justify-content: center;
            gap: 3vh;
            width: 100%;
            font-size: 1.8vh;
            color: var(--text-dim);
            font-weight: 500;
        }

        .weather-detail-item {
            display: flex;
            align-items: center;
            gap: 0.8vh;
        }

        /* Sidebar TJ Box */
        .tj-sidebar-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2vh 0;
        }

        .tj-sidebar-label {
            font-size: 3vh;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5vh;
            line-height: 1;
        }

        .tj-sidebar-value {
            font-size: 15vh;
            font-weight: 700;
            color: #fff;
            line-height: 0.9;
            text-shadow: 0 0 30px rgba(22, 163, 74, 0.5);
        }

        /* Main Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2.5vh;
            gap: 2.5vh;
            min-width: 0;
        }

        /* Header Bar */
        .top-bar {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2.5vh 4vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header-date {
            font-size: 3.2vh;
            font-weight: 700;
        }

        .header-tj {
            font-size: 3.2vh;
            font-weight: 700;
            color: var(--accent-green);
        }

        .header-progress {
            width: 25vw;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        .progress-bar {
            width: 100%;
            height: 1.5vh;
            background-color: #333;
            border-radius: 1vh;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* Menu Section - Side by Side */
        .menu-area {
            flex: 1;
            display: flex;
            gap: 2.5vh;
            min-height: 0;
        }

        .menu-column {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 3vh;
            display: flex;
            flex-direction: column;
            gap: 2vh;
            border: 1px solid #222;
        }

        .menu-title {
            font-size: 2.8vh;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 2vh;
        }

        .menu-title::before {
            content: '';
            width: 0.8vh;
            height: 4vh;
            background-color: var(--accent-green);
            display: block;
        }

        .menu-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        .meal-group {
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
        }

        .meal-name {
            font-size: 2.2vh;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: capitalize;
        }

        .dish-line {
            font-size: 1.8vh;
            display: flex;
            align-items: baseline;
            gap: 1.2vh;
            line-height: 1.3;
        }

        .dish-name {
            font-weight: 500;
        }

        .diet-tags {
            display: flex;
            gap: 0.6vh;
            flex-wrap: wrap;
        }

        .diet-tag {
            background-color: var(--military-green);
            color: #fff;
            font-size: 1.1vh;
            padding: 0.1vh 0.8vh;
            border-radius: 0.4vh;
            font-weight: 700;
            border: 1px solid var(--accent-green);
        }

        /* Footer */
        .footer-bar {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2vh;
            text-align: center;
            font-size: 1.5vh;
            color: var(--text-dim);
            font-weight: 500;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <!-- Sidebar with Large Logo -->
    <aside class="sidebar">
        <img src="/static/kh.svg" alt="KH Logo">

        <div class="tj-sidebar-box">
            <div class="tj-sidebar-label">TJ</div>
            <div class="tj-sidebar-value" id="tj-sidebar">--</div>
        </div>

        <div class="weather-box" id="weather-widget" style="display: none;">
            <div class="weather-title">Kajaani</div>
            <div class="weather-main">
                <i class="fas fa-cloud-sun weather-icon" id="w-icon"></i>
                <div class="weather-temp" id="w-temp">--°</div>
            </div>
            <div class="weather-details">
                <div class="weather-detail-item">
                    <i class="fas fa-wind"></i> <span id="w-wind">--</span> m/s
                </div>
                <div class="weather-detail-item">
                    <i class="fas fa-tint"></i> <span id="w-rain">--</span> mm
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="content">
        <header class="top-bar">
            <div class="header-date" id="date"></div>
            <div class="header-progress">
                <div style="font-size: 2vh; color: var(--text-dim);" id="percent">0% ohi</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>
        </header>

        <main class="menu-area">
            <div class="menu-column">
                <div class="menu-title">Varusmiehet</div>
                <div class="menu-items" id="conscript-list">Ladataan...</div>
            </div>
            <div class="menu-column">
                <div class="menu-title">Henkilöstö</div>
                <div class="menu-items" id="staff-list">Ladataan...</div>
            </div>
        </main>

        <footer class="footer-bar" id="countdown">
            Ladataan laskuria...
        </footer>
    </div>

    <script>
        const START_DATE = new Date('2026-01-05T00:00:00');
        const END_DATE = new Date('2026-09-16T00:00:00');

        function updateTime() {
            const now = new Date();

            // Date
            document.getElementById('date').textContent = `${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear()}`;

            // TJ
            const diff = END_DATE - now;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('tj-sidebar').textContent = days;

            // Progress
            const total = END_DATE - START_DATE;
            const current = now - START_DATE;
            const percent = Math.max(0, Math.min(100, (current / total) * 100));
            document.getElementById('percent').textContent = `${percent.toFixed(1)}% ohi`;
            document.getElementById('progress').style.width = `${percent}%`;

            // Footer Countdown
            const s = Math.floor(diff / 1000);
            const m = Math.floor(s / 60);
            const h = diff / (1000 * 60 * 60);
            const w = diff / (1000 * 60 * 60 * 24 * 7);
            const mo = diff / (1000 * 60 * 60 * 24 * 30.44);

            document.getElementById('countdown').textContent =
                `${mo.toFixed(1)} kk — ${w.toFixed(1)} vko — ${h.toFixed(1)} h — ${m} min — ${s} s`;
        }

        function formatList(data) {
            if (!data || !data.meals) return 'Ei ruokalistaa.';
            let html = '';
            data.meals.forEach(meal => {
                let name = meal.meal_name;
                if (name.toLowerCase() === 'aamupala') return;
                if (name.toLowerCase() === 'lounas 2') name = 'Päivällinen';

                html += `<div class="meal-group">`;
                html += `<div class="meal-name">${name}</div>`;
                meal.dishes.forEach(dish => {
                    html += `<div class="dish-line">`;
                    html += `<span class="dish-name">• ${dish.name}</span>`;
                    if (dish.diets) {
                        html += `<div class="diet-tags">`;
                        dish.diets.split(',').forEach(d => {
                            if (d.trim()) html += `<span class="diet-tag">${d.trim()}</span>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            });
            return html;
        }

        async function refresh() {
            try {
                const res = await fetch('/api/foodlist');
                const json = await res.json();
                if (json.data && !json.data.error) {
                    const idx = (new Date().getDay() + 6) % 7;
                    document.getElementById('conscript-list').innerHTML = formatList(json.data.conscript_menu[idx]);
                    document.getElementById('staff-list').innerHTML = formatList(json.data.staff_menu[idx]);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=64.2222&longitude=27.7286&current_weather=true&daily=precipitation_sum&timezone=Europe%2FHelsinki');
                const data = await res.json();
                if (data.current_weather) {
                    document.getElementById('weather-widget').style.display = 'flex';
                    document.getElementById('w-temp').textContent = Math.round(data.current_weather.temperature) + '°';
                    document.getElementById('w-wind').textContent = Math.round(data.current_weather.windspeed);
                    document.getElementById('w-rain').textContent = data.daily.precipitation_sum[0] || 0;

                    const code = data.current_weather.weathercode;
                    const icon = document.getElementById('w-icon');
                    if (code <= 3) icon.className = 'fas fa-cloud-sun weather-icon';
                    else if (code <= 48) icon.className = 'fas fa-cloud weather-icon';
                    else if (code <= 67) icon.className = 'fas fa-cloud-showers-heavy weather-icon';
                    else if (code <= 77) icon.className = 'fas fa-snowflake weather-icon';
                    else icon.className = 'fas fa-bolt weather-icon';
                }
            } catch (e) { console.error(e); }
        }

        setInterval(updateTime, 1000);
        setInterval(refresh, 1800000);
        setInterval(fetchWeather, 1800000);
        updateTime();
        refresh();
        fetchWeather();
    </script>
</body>

</html>
