<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMTK</title>
    <link rel="icon" type="image/svg+xml" href="/static/kh.svg">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-green: #16a34a;
            --military-green: #0f2b16;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rubik', sans-serif;
            background-color: #ffffff;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: block;
        }
        
        body > * {
            display: none !important;
        }

        /* Sidebar - Large Logo */
        .sidebar {
            width: 30%;
            background-color: var(--military-green);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 6vh 4vh;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .sidebar img {
            width: 90%;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.4));
        }

        /* Weather Widget */
        .weather-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            padding: 3vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .weather-title {
            font-size: 1.8vh;
            color: var(--accent-green);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 3vh;
        }

        .weather-icon {
            font-size: 6vh;
            color: #fff;
        }

        .weather-temp {
            font-size: 7vh;
            font-weight: 700;
            line-height: 1;
        }

        .weather-details {
            display: flex;
            justify-content: center;
            gap: 3vh;
            width: 100%;
            font-size: 1.8vh;
            color: var(--text-dim);
            font-weight: 500;
        }

        .weather-detail-item {
            display: flex;
            align-items: center;
            gap: 0.8vh;
        }

        /* Sidebar TJ Box */
        .tj-sidebar-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 2vh 0;
        }

        .tj-sidebar-label {
            font-size: 3vh;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5vh;
            line-height: 1;
        }

        .tj-sidebar-value {
            font-size: 15vh;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .tj-sidebar-batch {
            font-size: 3vh;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.2vh;
            margin-top: 1vh;
        }

        /* Main Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2vh;
            gap: 1.5vh;
            min-width: 0;
        }

        /* Header Bar */
        .top-bar {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2.5vh 4vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .header-date {
            font-size: 3.2vh;
            font-weight: 700;
        }

        .header-tj {
            font-size: 3.2vh;
            font-weight: 700;
            color: var(--accent-green);
        }

        .header-progress {
            width: 25vw;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
        }

        .progress-bar {
            width: 100%;
            height: 1.5vh;
            background-color: #333;
            border-radius: 1vh;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 1s ease-in-out;
        }

        /* Menu Section - Side by Side */
        .menu-area {
            flex: 1;
            display: flex;
            gap: 2.5vh;
            min-height: 0;
        }

        .menu-column {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 3vh;
            display: flex;
            flex-direction: column;
            gap: 2vh;
            border: 1px solid #222;
        }

        .menu-title {
            font-size: 2.8vh;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 2vh;
        }

        .menu-title::before {
            content: '';
            width: 0.8vh;
            height: 4vh;
            background-color: var(--accent-green);
            display: block;
        }

        .menu-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        .meal-group {
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
        }

        .meal-name {
            font-size: 2.2vh;
            font-weight: 700;
            color: var(--accent-green);
            text-transform: capitalize;
        }

        .dish-line {
            font-size: 1.8vh;
            display: flex;
            align-items: baseline;
            gap: 1.2vh;
            line-height: 1.3;
        }

        .dish-name {
            font-weight: 500;
        }

        .diet-tags {
            display: flex;
            gap: 0.6vh;
            flex-wrap: wrap;
        }

        .diet-tag {
            background-color: var(--military-green);
            color: #fff;
            font-size: 1.1vh;
            padding: 0.1vh 0.8vh;
            border-radius: 0.4vh;
            font-weight: 700;
            border: 1px solid var(--accent-green);
        }

        /* Footer */
        .footer-bar {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2.5vh 4vh;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            border: 1px solid #222;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* Batch Selection Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--accent-green);
            border-radius: 30px;
            padding: 4vh;
            max-width: 80%;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 0 50px rgba(22, 163, 74, 0.2);
        }

        .modal-title {
            font-size: 4vh;
            font-weight: 700;
            margin-bottom: 4vh;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .batch-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(15vh, 1fr));
            gap: 2vh;
        }

        .batch-item {
            background: rgba(22, 163, 74, 0.1);
            border: 1px solid rgba(22, 163, 74, 0.3);
            padding: 2.5vh;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 2.5vh;
            font-weight: 700;
        }

        .batch-item:hover {
            background: var(--accent-green);
            color: #000;
            transform: scale(1.05);
        }

        .batch-item.active {
            background: var(--accent-green);
            color: #000;
            box-shadow: 0 0 20px rgba(22, 163, 74, 0.5);
        }

        #header-batch {
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 1vh;
            user-select: none;
        }

        #header-batch:hover {
            transform: scale(1.05);
        }

        /* Fun Sentence Ticker */
        .ticker-wrap {
            width: 100%;
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 1.2vh 2.5vh;
            display: none;
            align-items: center;
            gap: 2vh;
            border: 1px solid #222;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }


        .ticker-content {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
        }

        .ticker {
            display: inline-block;
            font-size: 2vh;
            font-weight: 500;
            color: var(--text-main);
            padding-left: 100%;
            animation: ticker-animation 15s linear infinite;
        }

        @keyframes ticker-animation {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* Message Input Modal */
        #message-input-container {
            margin-top: 3vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        #fun-input {
            background: #222;
            border: 1px solid var(--accent-green);
            color: #fff;
            padding: 1.5vh;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1.8vh;
            width: 100%;
            outline: none;
        }
    </style>
</head>

<body>
    <!-- Sidebar with Large Logo -->
    <aside class="sidebar">
        <img src="/static/kh.svg" alt="KH Logo" onclick="openMessageModal()" style="cursor: pointer;">

        <div class="tj-sidebar-box">
            <div class="tj-sidebar-label">TJ</div>
            <div class="tj-sidebar-value" id="tj-sidebar">--</div>
        </div>

        <div class="weather-box" id="weather-widget" style="display: none;">
            <div class="weather-title">Kajaani</div>
            <div class="weather-main">
                <i class="fas fa-cloud-sun weather-icon" id="w-icon"></i>
                <div class="weather-temp" id="w-temp">--°</div>
            </div>
            <div class="weather-details">
                <div class="weather-detail-item">
                    <i class="fas fa-wind"></i> <span id="w-wind">--</span> m/s
                </div>
                <div class="weather-detail-item">
                    <i class="fas fa-tint"></i> <span id="w-rain">--</span> mm
                </div>
            </div>
        </div>

    </aside>

    <!-- Batch Selection Modal -->
    <div id="batch-modal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">Valitse saapumiserä</div>
            <div class="batch-grid" id="batch-grid">
                <!-- Batches will be populated here -->
            </div>
        </div>
    </div>

    <div id="message-modal" class="modal-overlay" onclick="closeMessageModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title">Liikkuva teksti</div>
            <input type="text" id="fun-input" placeholder="Kirjoita jotain hauskaa..." oninput="updateTicker()">
            <button onclick="closeMessageModal()"
                style="margin-top: 3vh; background: var(--accent-green); color: #000; border: none; padding: 1.5vh 4vh; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 2vh;">OK</button>
            <div style="margin-top: 2vh; color: var(--text-dim); font-size: 1.5vh;">Pyyhi tyhjäksi poistaaksesi</div>
        </div>
    </div>



    <!-- Ticker was here, now moved to sidebar -->

    <!-- Main Content -->
    <div class="content">
        <header class="top-bar">
            <div style="display: flex; align-items: center; gap: 2vh; min-width: 20vh;">
                <div id="header-clock" style="font-size: 3.2vh; font-weight: 700; color: #fff;"></div>
            </div>

            <div id="header-batch" onclick="openModal()"
                style="font-size: 3.2vh; font-weight: 700; color: var(--accent-green); text-align: center; cursor: pointer;"></div>

            <div class="header-date" id="date"
                style="font-size: 3.2vh; font-weight: 700; text-align: right; min-width: 20vh;"></div>
        </header>

        <!-- Announcement/Ticker Bar -->
        <div class="ticker-wrap" id="ticker-wrap">
            <div class="ticker-content">
                <div class="ticker" id="ticker-text"></div>
            </div>
        </div>

        <main class="menu-area">
            <div class="menu-column">
                <div class="menu-title">Varusmiehet</div>
                <div class="menu-items" id="conscript-list">Ladataan...</div>
            </div>
            <div class="menu-column">
                <div class="menu-title">Henkilöstö</div>
                <div class="menu-items" id="staff-list">Ladataan...</div>
            </div>
        </main>

        <footer class="footer-bar">
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.8vh; font-weight: 500;">
                <span id="percent" style="color: var(--text-dim);">0% ohi</span>
                <span id="countdown" style="color: var(--text-dim);">Ladataan laskuria...</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
        </footer>
    </div>

    <script>
        let currentBatch = null;
        const BATCHES = [];

        function getFirstMonday(year, month) {
            let d = new Date(year, month, 1);
            while (d.getDay() !== 1) {
                d.setDate(d.getDate() + 1);
            }
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function initBatches() {
            const startYear = 2026;
            for (let y = startYear; y < startYear + 5; y++) {
                // 1/xx
                const s1 = getFirstMonday(y, 0);
                const e1 = new Date(s1.getTime() + 254 * 24 * 60 * 60 * 1000);
                BATCHES.push({ id: `1/${y.toString().slice(-2)}`, start: s1, end: e1 });

                // 2/xx
                const s2 = getFirstMonday(y, 6);
                const e2 = new Date(s2.getTime() + 254 * 24 * 60 * 60 * 1000);
                BATCHES.push({ id: `2/${y.toString().slice(-2)}`, start: s2, end: e2 });
            }

            // Load from storage or default
            const saved = localStorage.getItem('selectedBatch');
            currentBatch = BATCHES.find(b => b.id === saved) || BATCHES[0];
            updateHeaderBatch();

            populateBatchGrid();
        }

        function updateHeaderBatch() {
            const el = document.getElementById('header-batch');
            if (el && currentBatch) {
                el.textContent = `${currentBatch.id}`;
            }
        }

        function populateBatchGrid() {
            const grid = document.getElementById('batch-grid');
            grid.innerHTML = '';
            BATCHES.forEach(batch => {
                const item = document.createElement('div');
                item.className = 'batch-item' + (currentBatch.id === batch.id ? ' active' : '');
                item.textContent = batch.id;
                item.onclick = () => selectBatch(batch.id);
                grid.appendChild(item);
            });
        }

        function selectBatch(id) {
            currentBatch = BATCHES.find(b => b.id === id);
            localStorage.setItem('selectedBatch', id);
            updateHeaderBatch();
            closeModal();
            updateTime();
            populateBatchGrid();
        }

        function openModal() {
            document.getElementById('batch-modal').style.display = 'flex';
        }

        function closeModal(e) {
            document.getElementById('batch-modal').style.display = 'none';
        }

        function openMessageModal() {
            document.getElementById('message-modal').style.display = 'flex';
            document.getElementById('fun-input').focus();
        }

        function closeMessageModal() {
            document.getElementById('message-modal').style.display = 'none';
        }



        function updateTicker() {
            const input = document.getElementById('fun-input').value;
            const wrap = document.getElementById('ticker-wrap');
            const text = document.getElementById('ticker-text');

            if (input.trim()) {
                text.textContent = input;
                wrap.style.display = 'flex';
                localStorage.setItem('funMessage', input);
            } else {
                wrap.style.display = 'none';
                localStorage.removeItem('funMessage');
            }
        }

        function initMessage() {
            const saved = localStorage.getItem('funMessage');
            if (saved) {
                document.getElementById('fun-input').value = saved;
                updateTicker();
            }
        }

        function updateTime() {
            if (!currentBatch) return;
            const now = new Date();
            const START_DATE = currentBatch.start;
            const END_DATE = currentBatch.end;

            // Date & Clock (24h)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const dateStr = `${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear()}`;
            document.getElementById('date').textContent = dateStr;
            const elClock = document.getElementById('header-clock');
            if (elClock) {
                elClock.textContent = `${hours}:${minutes}`;
            }

            // TJ
            const diff = END_DATE - now;
            let days = Math.ceil(diff / (1000 * 60 * 60 * 24));

            if (days < 0) days = 0;

            document.getElementById('tj-sidebar').textContent = days;

            // Progress
            const total = END_DATE - START_DATE;
            const current = now - START_DATE;
            const percent = Math.max(0, Math.min(100, (current / total) * 100));
            document.getElementById('percent').textContent = `${percent.toFixed(1)}% ohi`;
            document.getElementById('progress').style.width = `${percent}%`;

            // Footer Countdown
            const diffMs = Math.max(0, diff);
            const s = Math.floor(diffMs / 1000);
            const m = Math.floor(s / 60);
            const h = diffMs / (1000 * 60 * 60);
            const w = diffMs / (1000 * 60 * 60 * 24 * 7);
            const mo = diffMs / (1000 * 60 * 60 * 24 * 30.44);

            document.getElementById('countdown').textContent =
                `${mo.toFixed(1)} kk — ${w.toFixed(1)} vko — ${h.toFixed(1)} h — ${m} min — ${s} s`;
        }

        function formatList(data) {
            if (!data || !data.meals) return 'Ei ruokalistaa.';
            let html = '';
            data.meals.forEach(meal => {
                let name = meal.meal_name;
                if (name.toLowerCase() === 'aamupala') return;
                if (name.toLowerCase() === 'lounas 2') name = 'Päivällinen';

                html += `<div class="meal-group">`;
                html += `<div class="meal-name">${name}</div>`;
                meal.dishes.forEach(dish => {
                    html += `<div class="dish-line">`;
                    html += `<span class="dish-name">• ${dish.name}</span>`;
                    if (dish.diets) {
                        html += `<div class="diet-tags">`;
                        dish.diets.split(',').forEach(d => {
                            if (d.trim()) html += `<span class="diet-tag">${d.trim()}</span>`;
                        });
                        html += `</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            });
            return html;
        }

        async function refresh() {
            try {
                const res = await fetch('/api/foodlist');
                const json = await res.json();
                if (json.data && !json.data.error) {
                    const idx = (new Date().getDay() + 6) % 7;
                    const conscriptMenu = json.data.conscript_menu[idx];
                    const staffMenu = json.data.staff_menu[idx];

                    document.getElementById('conscript-list').innerHTML = formatList(conscriptMenu);
                    document.getElementById('staff-list').innerHTML = formatList(staffMenu);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=64.2222&longitude=27.7286&current_weather=true&daily=precipitation_sum&timezone=Europe%2FHelsinki');
                const data = await res.json();
                if (data.current_weather) {
                    document.getElementById('weather-widget').style.display = 'flex';
                    document.getElementById('w-temp').textContent = Math.round(data.current_weather.temperature) + '°';
                    document.getElementById('w-wind').textContent = Math.round(data.current_weather.windspeed);
                    document.getElementById('w-rain').textContent = data.daily.precipitation_sum[0] || 0;

                    const code = data.current_weather.weathercode;
                    const icon = document.getElementById('w-icon');
                    if (code <= 3) icon.className = 'fas fa-cloud-sun weather-icon';
                    else if (code <= 48) icon.className = 'fas fa-cloud weather-icon';
                    else if (code <= 67) icon.className = 'fas fa-cloud-showers-heavy weather-icon';
                    else if (code <= 77) icon.className = 'fas fa-snowflake weather-icon';
                    else icon.className = 'fas fa-bolt weather-icon';
                }
            } catch (e) { console.error(e); }
        }

        function scheduleReload() {
            const now = new Date();
            const nextReload = new Date();
            nextReload.setDate(now.getDate() + 1);
            nextReload.setHours(0, 1, 0, 0); // Reload at 00:01

            const diff = nextReload - now;
            setTimeout(() => window.location.reload(), diff);
        }

        function updateCanvasBackground() {
            const timestamp = new Date().getTime();
            const img = new Image();
            img.onload = () => {
                // Override background-image from CSS dynamically
                document.body.style.backgroundImage = `url('/api/canvas_image?t=${timestamp}')`;
            };
            img.onerror = () => {
                // Keep original background if saved_canvas.png is not available yet
            };
            img.src = `/api/canvas_image?t=${timestamp}`;
        }

        setInterval(updateTime, 1000);
        setInterval(refresh, 1800000);
        setInterval(fetchWeather, 1800000);
        setInterval(updateCanvasBackground, 10000); // Update canvas globally every 10s
        initBatches();
        initMessage();
        scheduleReload();
        updateTime();
        refresh();
        fetchWeather();
        updateCanvasBackground();
    </script>
</body>

</html>
